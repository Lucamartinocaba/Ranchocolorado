<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - Reserva Rancho Colorado</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <!-- Barra de navegación idéntica a tu diseño -->
    <header class="navbar">
        <div class="logo">Reserva Rancho Colorado</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="#">Servicios &#9662;</a></li>
                <li><a href="#">Tarifas</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="galeria.html" class="activo">Galería</a></li>
            </ul>
        </nav>
    </header>

    <!-- Contenedor principal -->
    <main class="contenedor-principal">
        <section class="tarjeta-galeria">
            <h1>Explora la reserva natural Rancho Colorado</h1>
            <p class="subtitulo">Conoce nuestros paisajes, senderos y espacios de descanso.</p>

            <!-- Sección con el mismo estilo de borde fino que tu formulario -->
            <fieldset class="grupo-fotos">
                <legend>Paisajes y Naturaleza</legend>
                
                <div class="grid-galeria">
                    <div class="item-foto">
                        <img src="entrada.png" alt="entrada">
                    </div>
                    <div class="item-foto">
                        <img src="garza.png" alt="garza">
                    </div>
                    <div class="item-foto">
                        <img src="pajarito.png" alt="pajarito">
                    </div>
                    <div class="item-foto">
                        <img src="fuego.png" alt="fuego">
                    </div>
                    <div class="item-foto">
                        <img src="atardecer.png" alt="Atardecer en Rancho Colorado">
                    </div>
                    <div class="item-foto">
                        <img src="camino.png" alt="camino">
                    </div>
                    <div class="item-foto">
                        <img src="feria.png" alt="feria">
                    </div>
                    <div class="item-foto">
                        <img src="cigueña.png" alt="cigueña">
                    </div>
                     <div class="item-foto">
                        <img src="muelle.png" alt="muelle">
                    </div>
                     <div class="item-foto">
                        <img src="lechuza.png" alt="lechuza">
                    </div>
                </div>
            </fieldset>

            <fieldset class="grupo-fotos">
                <legend>Cabañas y Estadía</legend>
                
                <div class="grid-galeria">
                    <div class="item-foto">
                        <img src="foto4.jpg" alt="Cabaña de madera">
                        <span>Cabaña del Bosque</span>
                    </div>
                    <div class="item-foto">
                        <img src="foto5.jpg" alt="Zona de descanso">
                        <span>Área de fogón</span>
                    </div>
                    <div class="item-foto">
                        <img src="foto6.jpg" alt="Vista desde la terraza">
                        <span>Terraza panorámica</span>
                    </div>
                </div>
            </fieldset>

        </section>
    </main>
<!-- Visor Lightbox para ampliar las fotos -->
    <div id="lightbox" class="lightbox">
        <span class="cerrar">&times;</span>
        <button class="flecha prev" onclick="cambiarFoto(-1)">&#10094;</button>
        
        <div class="lightbox-contenido">
            <img id="img-ampliada" src="" alt="Vista ampliada">
            <p id="caption-ampliado"></p>
        </div>
        
        <button class="flecha next" onclick="cambiarFoto(1)">&#10095;</button>
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const imgAmpliada = document.getElementById('img-ampliada');
        const captionAmpliado = document.getElementById('caption-ampliado');
        const cerrarBtn = document.querySelector('.cerrar');
        
        // Selecciona todas las imágenes dentro de las tarjetas
        const tarjetas = document.querySelectorAll('.item-foto');
        let indiceActual = 0;

        // Abre el visor al hacer clic en cualquier foto
        tarjetas.forEach((tarjeta, index) => {
            tarjeta.addEventListener('click', () => {
                indiceActual = index;
                mostrarFoto(indiceActual);
                lightbox.classList.add('activo');
            });
        });

        function mostrarFoto(index) {
            // Permite dar la vuelta si llegas al inicio o al final
            if (index >= tarjetas.length) indiceActual = 0;
            if (index < 0) indiceActual = tarjetas.length - 1;

            const img = tarjetas[indiceActual].querySelector('img');
            const texto = tarjetas[indiceActual].querySelector('span');

            imgAmpliada.src = img.src;
            captionAmpliado.textContent = texto ? texto.textContent : '';
        }

        function cambiarFoto(direccion) {
            indiceActual += direccion;
            mostrarFoto(indiceActual);
        }

        // Cerrar con la X
        cerrarBtn.addEventListener('click', () => {
            lightbox.classList.remove('activo');
        });

        // Cerrar al hacer clic fuera de la foto
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('activo');
            }
        });

        // Control con el teclado (Flechas izquierda/derecha y Escape)
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('activo')) return;
            
            if (e.key === 'ArrowRight') cambiarFoto(1);
            if (e.key === 'ArrowLeft') cambiarFoto(-1);
            if (e.key === 'Escape') lightbox.classList.remove('activo');
        });
    </script>
</body>
</html>
